<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат v3</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  :root { --bg:#ffffff; --panel:#f6f6f8; --line:#e4e4ea; --me:#3b3b46; --bot:#f0f0f4; --text:#1c1c22; --muted:#80808e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; }

  header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  header .title { flex: 1; font-weight: 600; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .iconbtn { width: 38px; height: 38px; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .burger { flex-direction: column; gap: 5px; }
  .burger i { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; }

  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.bot { align-self: flex-start; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: #d9d9e1; color: #55555f; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex: none; background-size: cover; background-position: center; }
  .msg { padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .user .msg { background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
  .bot .msg { background: var(--bot); border-bottom-left-radius: 4px; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }

  form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font: inherit; max-height: 120px; outline: none; }
  textarea:focus, input:focus { border-color: #a9a9b8; }
  button.btn { background: var(--me); color: #fff; border: 0; border-radius: 12px; padding: 0 18px; font: inherit; cursor: pointer; }
  button.btn:disabled { opacity: .5; }
  .light { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer; }

  /* панели */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #shade.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; bottom: 0; width: min(380px, 90vw); background: var(--bg); display: flex; flex-direction: column; transition: transform .2s; }
  #chatsPanel { left: 0; border-right: 1px solid var(--line); transform: translateX(-100%); }
  #setPanel { right: 0; border-left: 1px solid var(--line); transform: translateX(100%); }
  .drawer.on { transform: none; }
  .dhead { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .close { background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; color: var(--text); padding: 0 4px; }
  .dbody { flex: 1; overflow-y: auto; padding: 8px 16px 24px; }
  .dbody h4 { margin: 20px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .dbody label.l { display: block; margin: 10px 0 4px; font-size: 14px; color: var(--muted); }
  .dbody input[type=text], .dbody input[type=number] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit; }
  .avrow { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .avrow .av { width: 52px; height: 52px; font-size: 20px; }
  .avrow input[type=file] { display: none; }
  .mem { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .mem span { flex: 1; font-size: 15px; }
  .mem button, .chat button.del { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .newchat { width: 100%; margin: 12px 0 6px; }
  .chat { display: flex; align-items: center; gap: 6px; padding: 10px 10px; border-radius: 10px; cursor: pointer; }
  .chat:hover { background: var(--panel); }
  .chat.cur { background: var(--bot); }
  .chat .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
</style>
</head>
<body>

<header>
  <button class="iconbtn burger" id="burger" aria-label="Чаты"><i></i><i></i><i></i></button>
  <div class="title" id="titleBot">Чат v3</div>
  <button class="iconbtn" id="gear" aria-label="Настройки">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div id="log"></div>

<form id="form">
  <textarea id="inp" rows="1" placeholder="Сообщение"></textarea>
  <button type="submit" class="btn" id="send">Отправить</button>
</form>

<div id="shade"></div>

<!-- левая панель: чаты -->
<aside class="drawer" id="chatsPanel">
  <div class="dhead"><span>Чаты</span><button class="close" data-close aria-label="Закрыть">&times;</button></div>
  <div class="dbody">
    <button class="light newchat" id="newChat" type="button">Новый чат</button>
    <div id="chatList"></div>
  </div>
</aside>

<!-- правая панель: настройки -->
<aside class="drawer" id="setPanel">
  <div class="dhead"><span>Настройки</span><button class="close" data-close aria-label="Закрыть">&times;</button></div>
  <div class="dbody">

    <h4>Ты</h4>
    <label class="l">Имя</label>
    <input type="text" id="uName">
    <label class="l">Возраст</label>
    <input type="number" id="uAge" min="1" max="120">
    <label class="l">Аватарка</label>
    <div class="avrow">
      <div class="av" id="uAv"></div>
      <label class="light" style="cursor:pointer">Выбрать<input type="file" id="uFile" accept="image/*"></label>
      <button class="light" id="uDel" type="button">Убрать</button>
    </div>

    <h4>Бот</h4>
    <label class="l">Имя</label>
    <input type="text" id="bName">
    <label class="l">Аватарка</label>
    <div class="avrow">
      <div class="av" id="bAv"></div>
      <label class="light" style="cursor:pointer">Выбрать<input type="file" id="bFile" accept="image/*"></label>
      <button class="light" id="bDel" type="button">Убрать</button>
    </div>

    <h4>Память ИИ</h4>
    <div id="memList"></div>
    <button class="light" id="clrMem" type="button" style="margin-top:12px">Очистить память</button>
  </div>
</aside>

<script>
/* ====== ЗДЕСЬ МЕНЯЕТСЯ ВСЁ ГЛАВНОЕ ====== */
const WORKER_URL = "https://gemmaaimy.comedyfox6.workers.dev";
const SYSTEM_PROMPT = "Ты дружелюбный, живой собеседник. Отвечай по-русски, коротко и по делу.";
/* ======================================== */

const $ = (id) => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { alert("Не удалось сохранить: " + e.message); } };

const MEMORY_RULES =
  "\n\nУ тебя есть долговременная память. Если пользователь рассказал что-то важное и долговечное " +
  "(предпочтения, планы, факты о нём), запиши это, добавив в конец ответа тег " +
  "[[mem: краткий факт]]. Можно несколько тегов. Не записывай мелочи и не дублируй уже известное. " +
  "Тег пользователю не виден, не упоминай его.";

let memory = load("memory", []);
let cfg = Object.assign({ uName: "", uAge: "", uAv: "", bName: "", bAv: "" }, load("cfg", {}));

/* ---------- чаты ---------- */
let chats = load("chats", []);          // [{id, title, messages:[{role,content}]}]
let curId = load("curId", null);

// перенос старой единственной истории, если была
const oldHistory = load("history", null);
if (oldHistory && oldHistory.length && !chats.length) {
  chats.push({ id: "c" + Date.now(), title: oldHistory[0].content.slice(0, 30), messages: oldHistory });
  localStorage.removeItem("history");
}
if (!chats.length) chats.push({ id: "c" + Date.now(), title: "Новый чат", messages: [] });
if (!chats.find((c) => c.id === curId)) curId = chats[0].id;

const cur = () => chats.find((c) => c.id === curId);
const saveChats = () => { save("chats", chats); save("curId", curId); };

function newChat() {
  // не плодим пустые чаты
  const empty = chats.find((c) => !c.messages.length);
  if (empty) { curId = empty.id; }
  else { const c = { id: "c" + Date.now(), title: "Новый чат", messages: [] }; chats.unshift(c); curId = c.id; }
  saveChats(); renderAll(); closePanels();
}

function deleteChat(id) {
  if (!confirm("Удалить этот чат?")) return;
  chats = chats.filter((c) => c.id !== id);
  if (!chats.length) chats.push({ id: "c" + Date.now(), title: "Новый чат", messages: [] });
  if (!chats.find((c) => c.id === curId)) curId = chats[0].id;
  saveChats(); renderAll();
}

function renderChatList() {
  const box = $("chatList");
  box.innerHTML = "";
  chats.forEach((c) => {
    const row = document.createElement("div");
    row.className = "chat" + (c.id === curId ? " cur" : "");
    const t = document.createElement("span");
    t.className = "t"; t.textContent = c.title || "Новый чат";
    const d = document.createElement("button");
    d.className = "del"; d.type = "button"; d.textContent = "Удалить";
    d.onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
    row.append(t, d);
    row.onclick = () => { curId = c.id; saveChats(); renderAll(); closePanels(); };
    box.appendChild(row);
  });
}

/* ---------- аватарки ---------- */
function setAv(el, img, name) {
  if (img) { el.style.backgroundImage = "url(" + img + ")"; el.textContent = ""; }
  else { el.style.backgroundImage = ""; el.textContent = (name || "?").trim().charAt(0).toUpperCase(); }
}

function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const fr = new FileReader();
    fr.onload = () => { img.src = fr.result; };
    fr.onerror = reject;
    img.onload = () => {
      const S = 128, c = document.createElement("canvas");
      c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    fr.readAsDataURL(file);
  });
}

/* ---------- сообщения ---------- */
function add(role, text) {
  if (role === "sys") {
    const s = document.createElement("div");
    s.className = "sys"; s.textContent = text;
    $("log").appendChild(s); $("log").scrollTop = 1e9;
    return s;
  }
  const row = document.createElement("div");
  row.className = "row " + role;
  const av = document.createElement("div");
  av.className = "av";
  if (role === "user") setAv(av, cfg.uAv, cfg.uName || "Я");
  else setAv(av, cfg.bAv, cfg.bName || "Б");
  const msg = document.createElement("div");
  msg.className = "msg"; msg.textContent = text;
  row.append(av, msg);
  $("log").appendChild(row); $("log").scrollTop = 1e9;
  return msg;
}

function renderMessages() {
  $("log").innerHTML = "";
  cur().messages.forEach((m) => add(m.role === "user" ? "user" : "bot", m.content));
  $("titleBot").textContent = cfg.bName || "Чат v3";
}

function renderAll() { renderMessages(); renderChatList(); }

function buildMessages() {
  let sys = SYSTEM_PROMPT;
  if (cfg.bName) sys += "\n\nТебя зовут " + cfg.bName + ".";
  const who = [];
  if (cfg.uName) who.push("Пользователя зовут " + cfg.uName + ".");
  if (cfg.uAge) who.push("Ему/ей " + cfg.uAge + " лет.");
  if (who.length) sys += "\n\n" + who.join(" ");
  sys += MEMORY_RULES;
  if (memory.length) sys += "\n\nТо, что ты помнишь о пользователе:\n- " + memory.join("\n- ");
  return [{ role: "system", content: sys }, ...cur().messages.slice(-20)];
}

function extractMemory(text) {
  const re = /\[\[\s*mem\s*:\s*([^\]]+?)\s*\]\]/gi;
  let m, added = 0;
  while ((m = re.exec(text))) {
    const fact = m[1].trim();
    if (fact && !memory.includes(fact)) { memory.push(fact); added++; }
  }
  if (added) { save("memory", memory); renderMem(); }
  return { clean: text.replace(re, "").trim(), added };
}

async function send(text) {
  const chat = cur();
  chat.messages.push({ role: "user", content: text });
  if (chat.messages.length === 1) chat.title = text.slice(0, 30);
  saveChats(); renderChatList();
  add("user", text);
  const wait = add("bot", "...");
  $("send").disabled = true;
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: buildMessages() }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "HTTP " + res.status);
    const { clean, added } = extractMemory(data.reply || "");
    const reply = clean || "(пустой ответ)";
    chat.messages.push({ role: "assistant", content: reply });
    saveChats();
    wait.textContent = reply;
    if (added) add("sys", "Запомнил: " + added);
  } catch (e) {
    wait.parentElement.remove();
    add("sys", "Ошибка: " + e.message);
    chat.messages.pop();
    saveChats();
  } finally {
    $("send").disabled = false;
    $("log").scrollTop = 1e9;
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = $("inp").value.trim();
  if (!t) return;
  $("inp").value = "";
  send(t);
});
$("inp").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});

/* ---------- панели ---------- */
function closePanels() {
  $("chatsPanel").classList.remove("on");
  $("setPanel").classList.remove("on");
  $("shade").classList.remove("on");
}
$("burger").onclick = () => { renderChatList(); $("chatsPanel").classList.add("on"); $("shade").classList.add("on"); };
$("gear").onclick = () => { fillForm(); renderMem(); $("setPanel").classList.add("on"); $("shade").classList.add("on"); };
$("shade").onclick = closePanels;
document.querySelectorAll("[data-close]").forEach((b) => (b.onclick = closePanels));
$("newChat").onclick = newChat;

/* ---------- настройки ---------- */
function fillForm() {
  $("uName").value = cfg.uName; $("uAge").value = cfg.uAge; $("bName").value = cfg.bName;
  setAv($("uAv"), cfg.uAv, cfg.uName || "Я");
  setAv($("bAv"), cfg.bAv, cfg.bName || "Б");
}

function bind(id, key, after) {
  $(id).addEventListener("input", () => {
    cfg[key] = $(id).value.trim();
    save("cfg", cfg);
    if (after) after();
  });
}
bind("uName", "uName", () => { setAv($("uAv"), cfg.uAv, cfg.uName || "Я"); renderMessages(); });
bind("uAge", "uAge");
bind("bName", "bName", () => { setAv($("bAv"), cfg.bAv, cfg.bName || "Б"); renderMessages(); });

async function pickAvatar(fileId, key, avId, name) {
  const f = $(fileId).files[0];
  if (!f) return;
  try {
    cfg[key] = await fileToAvatar(f);
    save("cfg", cfg);
    setAv($(avId), cfg[key], name());
    renderMessages();
  } catch { alert("Не получилось прочитать картинку"); }
  $(fileId).value = "";
}
$("uFile").onchange = () => pickAvatar("uFile", "uAv", "uAv", () => cfg.uName || "Я");
$("bFile").onchange = () => pickAvatar("bFile", "bAv", "bAv", () => cfg.bName || "Б");
$("uDel").onclick = () => { cfg.uAv = ""; save("cfg", cfg); fillForm(); renderMessages(); };
$("bDel").onclick = () => { cfg.bAv = ""; save("cfg", cfg); fillForm(); renderMessages(); };

function renderMem() {
  const box = $("memList");
  box.innerHTML = memory.length ? "" : "<div class='empty'>Пока пусто. ИИ запишет сюда важное сам.</div>";
  memory.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "mem";
    row.innerHTML = "<span></span><button type='button'>Удалить</button>";
    row.firstChild.textContent = f;
    row.lastChild.onclick = () => { memory.splice(i, 1); save("memory", memory); renderMem(); };
    box.appendChild(row);
  });
}
$("clrMem").onclick = () => { if (confirm("Стереть всю память?")) { memory = []; save("memory", memory); renderMem(); } };

fillForm();
renderMem();
renderAll();
</script>
</body>
</html>
