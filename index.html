<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Чат</title>
<style>
  :root { --bg:#ffffff; --panel:#f5f6f8; --line:#e6e7ec; --accent:#4d6bfe; --text:#16171b; --muted:#8a8c98; --tint:#eef4ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: linear-gradient(180deg, var(--tint) 0%, var(--bg) 55%) no-repeat, var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  svg { display: block; }
  .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* верхняя панель */
  header { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 6px; }
  .circle, .pill button { background: var(--bg); border: 1px solid var(--line); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .circle { width: 44px; height: 44px; border-radius: 50%; padding: 0; }
  .pill { display: flex; border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
  .pill button { border: 0; width: 48px; height: 42px; border-radius: 0; }

  .clock { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
  .clock b { color: var(--text); font-weight: 600; }

  /* сообщения */
  .col { display: flex; flex-direction: column; min-width: 0; }
  .row.user .col { align-items: flex-end; }
  .time { font-size: 11px; color: var(--muted); margin: 3px 6px 0; }
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #aeb1bf; animation: bob 1.1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 70%, 100% { transform: translateY(0); opacity: .5; } 35% { transform: translateY(-5px); opacity: 1; } }

  #log { flex: 1; overflow-y: auto; padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.bot { align-self: flex-start; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: #dfe1e8; color: #5b5d69; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex: none; background-size: cover; background-position: center; }
  .msg { padding: 9px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .user .msg { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
  .bot .msg { background: var(--panel); border-bottom-left-radius: 5px; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }

  #hero { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 30px; text-align: center; }
  #hero.on { display: flex; }
  #hero .logo { width: 68px; height: 68px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; }
  #hero .sub { color: var(--muted); font-size: 15px; margin-top: -10px; }
  #hero h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; }

  /* поле ввода */
  .composer { margin: 0 12px calc(12px + env(safe-area-inset-bottom)); background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: 12px 12px 10px 18px; }
  .composer textarea { width: 100%; resize: none; background: transparent; color: var(--text); border: 0; outline: none; font: inherit; max-height: 140px; padding: 0; display: block; }
  .composer .bar { display: flex; justify-content: flex-end; margin-top: 4px; }
  #send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  #send:disabled { opacity: .45; }

  /* панели */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #shade.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; bottom: 0; width: min(340px, 88vw); background: var(--bg); display: flex; flex-direction: column; transition: transform .22s; }
  #chatsPanel { left: 0; transform: translateX(-102%); }
  #setPanel { right: 0; transform: translateX(102%); width: min(380px, 92vw); }
  #chatsPanel.on, #setPanel.on { transform: none; }
  #chatsPanel.on { box-shadow: 6px 0 30px rgba(0,0,0,.08); }
  #setPanel.on { box-shadow: -6px 0 30px rgba(0,0,0,.08); }

  .search { margin: calc(14px + env(safe-area-inset-top)) 14px 6px; display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 46px; border: 1px solid var(--line); border-radius: 23px; color: var(--muted); }
  .search input { flex: 1; border: 0; outline: none; background: transparent; font: inherit; color: var(--text); min-width: 0; }
  #chatList { flex: 1; overflow-y: auto; padding: 4px 14px 10px; }
  .group { margin: 18px 0 6px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .chat { display: flex; align-items: center; gap: 6px; padding: 11px 10px; margin: 0 -10px; border-radius: 12px; cursor: pointer; }
  .chat.cur { background: var(--panel); }
  .chat .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 17px; }
  .chat .del { background: none; border: 0; color: var(--muted); padding: 6px; cursor: pointer; display: flex; }
  .noresult { color: var(--muted); padding: 20px 0; text-align: center; font-size: 14px; }
  .me { display: flex; align-items: center; gap: 12px; padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); cursor: pointer; }
  .me .av { width: 40px; height: 40px; font-size: 16px; }
  .me .n { flex: 1; font-size: 17px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  .dhead { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .close { background: none; border: 0; font-size: 28px; line-height: 1; cursor: pointer; color: var(--text); padding: 0 4px; }
  .dbody { flex: 1; overflow-y: auto; padding: 4px 16px 28px; }
  .dbody h4 { margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .dbody label.l { display: block; margin: 10px 0 4px; font-size: 14px; color: var(--muted); }
  .dbody input[type=text], .dbody input[type=number] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; outline: none; }
  .avrow { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .avrow .av { width: 54px; height: 54px; font-size: 20px; }
  .avrow input[type=file] { display: none; }
  .light { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font: inherit; cursor: pointer; }
  .mem { display: flex; gap: 8px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .mem span { flex: 1; font-size: 15px; }
  .mem button { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>

<header>
  <button class="circle" id="burger" aria-label="Чаты">
    <svg width="22" height="22" viewBox="0 0 24 24" class="ic"><path d="M4 8h16M4 16h9"/></svg>
  </button>
  <div class="clock" id="clock"></div>
  <div class="pill">
    <button id="gear" aria-label="Настройки">
      <svg width="22" height="22" viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button id="newTop" aria-label="Новый чат">
      <svg width="24" height="24" viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    </button>
  </div>
</header>

<div id="hero">
  <div class="logo" id="heroLogo"></div>
  <h1 id="greet">Привет</h1>
  <div class="sub" id="dateLine"></div>
</div>
<div id="log"></div>

<form id="form" class="composer">
  <textarea id="inp" rows="1" placeholder="Напишите сообщение"></textarea>
  <div class="bar">
    <button type="submit" id="send" aria-label="Отправить">
      <svg width="22" height="22" viewBox="0 0 24 24" class="ic" style="stroke-width:2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</form>

<div id="shade"></div>

<!-- левая панель: только чаты -->
<aside class="drawer" id="chatsPanel">
  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="text" id="q" placeholder="Поиск в содержимом чата...">
  </div>
  <div id="chatList"></div>
  <div class="me" id="meRow">
    <div class="av" id="meAv"></div>
    <div class="n" id="meName"></div>
  </div>
</aside>

<!-- правая панель: настройки -->
<aside class="drawer" id="setPanel">
  <div class="dhead"><span>Настройки</span><button class="close" id="closeSet" aria-label="Закрыть">&times;</button></div>
  <div class="dbody">

    <h4>Ты</h4>
    <label class="l">Имя</label>
    <input type="text" id="uName">
    <label class="l">Возраст</label>
    <input type="number" id="uAge" min="1" max="120">
    <label class="l">Аватарка</label>
    <div class="avrow">
      <div class="av" id="uAv"></div>
      <label class="light" style="cursor:pointer">Выбрать<input type="file" id="uFile" accept="image/*"></label>
      <button class="light" id="uDel" type="button">Убрать</button>
    </div>

    <h4>Бот</h4>
    <label class="l">Имя</label>
    <input type="text" id="bName">
    <label class="l">Аватарка</label>
    <div class="avrow">
      <div class="av" id="bAv"></div>
      <label class="light" style="cursor:pointer">Выбрать<input type="file" id="bFile" accept="image/*"></label>
      <button class="light" id="bDel" type="button">Убрать</button>
    </div>

    <h4>Память ИИ</h4>
    <div id="memList"></div>
    <button class="light" id="clrMem" type="button" style="margin-top:12px">Очистить память</button>
  </div>
</aside>

<script>
/* ====== ЗДЕСЬ МЕНЯЕТСЯ ВСЁ ГЛАВНОЕ ====== */
const WORKER_URL = "https://gemmaaimy.comedyfox6.workers.dev";
const SYSTEM_PROMPT = "Ты дружелюбный, живой собеседник. Отвечай по-русски, коротко и по делу.";
/* ======================================== */

const $ = (id) => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { alert("Не удалось сохранить: " + e.message); } };

const EXTRACT_PROMPT =
  "Ты извлекаешь долговременные факты о пользователе из его сообщения. " +
  "Верни ТОЛЬКО JSON-массив коротких строк на русском (имя, возраст, предпочтения, планы, важные факты о нём или его жизни). " +
  "Если важного нет, верни []. Не включай вопросы, мелочи и шутки. Никакого текста кроме JSON.";

const BOT_ICON = '<svg width="34" height="34" viewBox="0 0 24 24" class="ic" style="stroke-width:1.7"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';

/* ---------- время по Москве ---------- */
const MSK = "Europe/Moscow";
const fmt = (o) => new Intl.DateTimeFormat("ru-RU", Object.assign({ timeZone: MSK }, o));
const mskClock = (t = Date.now()) => fmt({ hour: "2-digit", minute: "2-digit" }).format(t);
const mskDate = (t = Date.now()) => fmt({ weekday: "long", day: "numeric", month: "long" }).format(t);
const mskNow = () => fmt({ weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }).format(Date.now());
const mskHour = () => parseInt(fmt({ hour: "2-digit", hourCycle: "h23" }).format(Date.now()), 10);

function phase() {
  const h = mskHour();
  if (h >= 5 && h < 11) return { name: "Доброе утро", tint: "#fff3e4", sun: true };
  if (h >= 11 && h < 17) return { name: "Добрый день", tint: "#eaf3ff", sun: true };
  if (h >= 17 && h < 23) return { name: "Добрый вечер", tint: "#f1ebff", sun: false };
  return { name: "Доброй ночи", tint: "#e9edf6", sun: false };
}
const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" class="ic"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';

function tick() {
  const ph = phase();
  document.documentElement.style.setProperty("--tint", ph.tint);
  $("clock").innerHTML = (ph.sun ? SUN : MOON) + "<b>" + mskClock() + "</b><span>МСК</span>";
  $("greet").textContent = ph.name + (cfg.uName ? ", " + cfg.uName : "");
  const dl = mskDate();
  $("dateLine").textContent = dl.charAt(0).toUpperCase() + dl.slice(1);
}

function timeEl(ts) {
  const t = document.createElement("div");
  t.className = "time"; t.textContent = mskClock(ts);
  return t;
}

let memory = load("memory", []);
let cfg = Object.assign({ uName: "", uAge: "", uAv: "", bName: "", bAv: "" }, load("cfg", {}));

/* ---------- чаты ---------- */
const newId = () => "c" + Date.now() + Math.floor(Math.random() * 1000);
let chats = load("chats", []);
let curId = load("curId", null);

const oldHistory = load("history", null);
if (oldHistory && oldHistory.length && !chats.length) {
  chats.push({ id: newId(), ts: Date.now(), title: oldHistory[0].content.slice(0, 30), messages: oldHistory });
  localStorage.removeItem("history");
}
chats.forEach((c) => { if (!c.ts) c.ts = Date.now(); });
if (!chats.length) chats.push({ id: newId(), ts: Date.now(), title: "Новый чат", messages: [] });
if (!chats.find((c) => c.id === curId)) curId = chats[0].id;

const cur = () => chats.find((c) => c.id === curId);
const saveChats = () => { save("chats", chats); save("curId", curId); };

function newChat() {
  const empty = chats.find((c) => !c.messages.length);
  if (empty) curId = empty.id;
  else { const c = { id: newId(), ts: Date.now(), title: "Новый чат", messages: [] }; chats.unshift(c); curId = c.id; }
  saveChats(); renderAll(); closePanels();
}

function deleteChat(id) {
  if (!confirm("Удалить этот чат?")) return;
  chats = chats.filter((c) => c.id !== id);
  if (!chats.length) chats.push({ id: newId(), ts: Date.now(), title: "Новый чат", messages: [] });
  if (!chats.find((c) => c.id === curId)) curId = chats[0].id;
  saveChats(); renderAll();
}

function dayLabel(ts) {
  const d = new Date(ts), n = new Date();
  const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((start(n) - start(d)) / 86400000);
  return diff <= 0 ? "Сегодня" : diff === 1 ? "Вчера" : "Ранее";
}

function renderChatList() {
  const box = $("chatList");
  const q = $("q").value.trim().toLowerCase();
  box.innerHTML = "";
  const list = chats
    .filter((c) => !q || (c.title || "").toLowerCase().includes(q) || c.messages.some((m) => m.content.toLowerCase().includes(q)))
    .sort((a, b) => b.ts - a.ts);
  if (!list.length) { box.innerHTML = "<div class='noresult'>Ничего не найдено</div>"; return; }
  let last = "";
  list.forEach((c) => {
    const g = dayLabel(c.ts);
    if (g !== last) { const h = document.createElement("div"); h.className = "group"; h.textContent = g; box.appendChild(h); last = g; }
    const row = document.createElement("div");
    row.className = "chat" + (c.id === curId ? " cur" : "");
    const t = document.createElement("span");
    t.className = "t"; t.textContent = c.title || "Новый чат";
    const d = document.createElement("button");
    d.className = "del"; d.type = "button"; d.setAttribute("aria-label", "Удалить");
    d.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" class="ic"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
    d.onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
    row.append(t, d);
    row.onclick = () => { curId = c.id; saveChats(); renderAll(); closePanels(); };
    box.appendChild(row);
  });
}

/* ---------- аватарки ---------- */
function setAv(el, img, name) {
  if (img) { el.style.backgroundImage = "url(" + img + ")"; el.textContent = ""; }
  else { el.style.backgroundImage = ""; el.textContent = (name || "?").trim().charAt(0).toUpperCase(); }
}

function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const fr = new FileReader();
    fr.onload = () => { img.src = fr.result; };
    fr.onerror = reject;
    img.onload = () => {
      const S = 128, c = document.createElement("canvas");
      c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    fr.readAsDataURL(file);
  });
}

/* ---------- сообщения ---------- */
function add(role, text, ts) {
  if (role === "sys") {
    const s = document.createElement("div");
    s.className = "sys"; s.textContent = text;
    $("log").appendChild(s); $("log").scrollTop = 1e9;
    return s;
  }
  const row = document.createElement("div");
  row.className = "row " + role;
  const av = document.createElement("div");
  av.className = "av";
  if (role === "user") setAv(av, cfg.uAv, cfg.uName || "Я");
  else setAv(av, cfg.bAv, cfg.bName || "Б");
  const col = document.createElement("div");
  col.className = "col";
  const msg = document.createElement("div");
  msg.className = "msg"; msg.textContent = text;
  col.append(msg);
  if (ts) col.append(timeEl(ts));
  row.append(av, col);
  $("log").appendChild(row); $("log").scrollTop = 1e9;
  return msg;
}

function updateHero() {
  const empty = !cur().messages.length;
  $("hero").classList.toggle("on", empty);
  $("log").style.display = empty ? "none" : "flex";
  const logo = $("heroLogo");
  if (cfg.bAv) { logo.style.backgroundImage = "url(" + cfg.bAv + ")"; logo.innerHTML = ""; }
  else { logo.style.backgroundImage = ""; logo.innerHTML = ""; }
  logo.style.display = cfg.bAv ? "flex" : "none";
}

function renderMessages() {
  $("log").innerHTML = "";
  cur().messages.forEach((m) => add(m.role === "user" ? "user" : "bot", m.content, m.t));
  updateHero();
}

function renderMe() {
  setAv($("meAv"), cfg.uAv, cfg.uName || "Я");
  $("meName").textContent = cfg.uName || "Профиль";
}

function renderAll() { renderMessages(); renderChatList(); renderMe(); }

function buildMessages() {
  let sys = SYSTEM_PROMPT + "\n\nСейчас " + mskNow() + " (московское время).";
  if (cfg.bName) sys += "\n\nТебя зовут " + cfg.bName + ".";
  const who = [];
  if (cfg.uName) who.push("Пользователя зовут " + cfg.uName + ".");
  if (cfg.uAge) who.push("Ему/ей " + cfg.uAge + " лет.");
  if (who.length) sys += "\n\n" + who.join(" ");
  if (memory.length) sys += "\n\nТо, что ты знаешь о пользователе (используй естественно, не перечисляй):\n- " + memory.join("\n- ");
  return [{ role: "system", content: sys }, ...cur().messages.slice(-20).map(({ role, content }) => ({ role, content }))];
}

function extractMemory(text) {
  const re = /\[\[\s*mem\s*:\s*([^\]]+?)\s*\]\]/gi;
  let m, added = 0;
  while ((m = re.exec(text))) {
    const fact = m[1].trim();
    if (fact && !memory.includes(fact)) { memory.push(fact); added++; }
  }
  if (added) { save("memory", memory); renderMem(); }
  return { clean: text.replace(re, "").trim(), added };
}

async function learn(text) {
  if (text.length < 4) return 0;
  try {
    const known = memory.length ? "\nУже известно, не повторяй:\n- " + memory.join("\n- ") : "";
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [
        { role: "system", content: EXTRACT_PROMPT + known },
        { role: "user", content: text },
      ] }),
    });
    const data = await res.json();
    const m = (data.reply || "").match(/\[[\s\S]*\]/);
    if (!m) return 0;
    const arr = JSON.parse(m[0]);
    let added = 0;
    for (const f of arr) {
      const fact = typeof f === "string" ? f.trim().slice(0, 140) : "";
      if (fact && memory.length < 200 && !memory.some((x) => x.toLowerCase() === fact.toLowerCase())) { memory.push(fact); added++; if (added >= 3) break; }
    }
    if (added) { save("memory", memory); renderMem(); }
    return added;
  } catch { return 0; }
}

async function send(text) {
  const chat = cur();
  const sentAt = Date.now();
  chat.messages.push({ role: "user", content: text, t: sentAt });
  if (chat.messages.length === 1) { chat.title = text.slice(0, 30); chat.ts = Date.now(); }
  saveChats(); renderChatList(); updateHero();
  add("user", text, sentAt);
  const wait = add("bot", "");
  wait.classList.add("typing");
  wait.innerHTML = "<i></i><i></i><i></i>";
  $("send").disabled = true;
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: buildMessages() }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "HTTP " + res.status);
    const { clean, added } = extractMemory(data.reply || "");
    const reply = clean || "(пустой ответ)";
    const doneAt = Date.now();
    chat.messages.push({ role: "assistant", content: reply, t: doneAt });
    saveChats();
    wait.classList.remove("typing");
    wait.textContent = reply;
    wait.parentElement.append(timeEl(doneAt));
    if (added) add("sys", "Запомнил: " + added);
    learn(text).then((n) => { if (n && cur() === chat) add("sys", "Запомнил: " + n); });
  } catch (e) {
    wait.closest(".row").remove();
    add("sys", "Ошибка: " + e.message);
    chat.messages.pop();
    saveChats();
  } finally {
    $("send").disabled = false;
    $("log").scrollTop = 1e9;
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = $("inp").value.trim();
  if (!t || $("send").disabled) return;
  $("inp").value = "";
  $("inp").style.height = "auto";
  send(t);
});
$("inp").addEventListener("input", () => { const el = $("inp"); el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 140) + "px"; });
$("inp").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});

/* ---------- панели ---------- */
function closePanels() {
  $("chatsPanel").classList.remove("on");
  $("setPanel").classList.remove("on");
  $("shade").classList.remove("on");
}
$("burger").onclick = () => { $("q").value = ""; renderChatList(); $("chatsPanel").classList.add("on"); $("shade").classList.add("on"); };
function openSettings() { fillForm(); renderMem(); $("chatsPanel").classList.remove("on"); $("setPanel").classList.add("on"); $("shade").classList.add("on"); }
$("gear").onclick = openSettings;
$("meRow").onclick = openSettings;
$("closeSet").onclick = closePanels;
$("shade").onclick = closePanels;
$("newTop").onclick = newChat;
$("q").addEventListener("input", renderChatList);

/* ---------- настройки ---------- */
function fillForm() {
  $("uName").value = cfg.uName; $("uAge").value = cfg.uAge; $("bName").value = cfg.bName;
  setAv($("uAv"), cfg.uAv, cfg.uName || "Я");
  setAv($("bAv"), cfg.bAv, cfg.bName || "Б");
}

function bind(id, key, after) {
  $(id).addEventListener("input", () => {
    cfg[key] = $(id).value.trim();
    save("cfg", cfg);
    if (after) after();
  });
}
bind("uName", "uName", () => { setAv($("uAv"), cfg.uAv, cfg.uName || "Я"); renderMessages(); renderMe(); tick(); });
bind("uAge", "uAge");
bind("bName", "bName", () => { setAv($("bAv"), cfg.bAv, cfg.bName || "Б"); renderMessages(); });

async function pickAvatar(fileId, key, avId, name) {
  const f = $(fileId).files[0];
  if (!f) return;
  try {
    cfg[key] = await fileToAvatar(f);
    save("cfg", cfg);
    setAv($(avId), cfg[key], name());
    renderMessages(); renderMe();
  } catch { alert("Не получилось прочитать картинку"); }
  $(fileId).value = "";
}
$("uFile").onchange = () => pickAvatar("uFile", "uAv", "uAv", () => cfg.uName || "Я");
$("bFile").onchange = () => pickAvatar("bFile", "bAv", "bAv", () => cfg.bName || "Б");
$("uDel").onclick = () => { cfg.uAv = ""; save("cfg", cfg); fillForm(); renderMessages(); renderMe(); };
$("bDel").onclick = () => { cfg.bAv = ""; save("cfg", cfg); fillForm(); renderMessages(); };

function renderMem() {
  const box = $("memList");
  box.innerHTML = memory.length ? "" : "<div class='empty'>Пока пусто. ИИ запишет сюда важное сам.</div>";
  memory.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "mem";
    row.innerHTML = "<span></span><button type='button'>Удалить</button>";
    row.firstChild.textContent = f;
    row.lastChild.onclick = () => { memory.splice(i, 1); save("memory", memory); renderMem(); };
    box.appendChild(row);
  });
}
$("clrMem").onclick = () => { if (confirm("Стереть всю память?")) { memory = []; save("memory", memory); renderMem(); } };

fillForm();
renderMem();
renderAll();
tick();
setInterval(tick, 20000);
</script>
