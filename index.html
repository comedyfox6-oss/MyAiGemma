<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Gemma — чат</title>
<style>
:root{color-scheme:light;--bg:#fff;--surface:#f7f7f8;--surface2:#eeeef0;--line:#e7e7eb;--text:#202024;--muted:#777780;--accent:#242429;--bubble:#f1f1f3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.topbar{height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.iconbtn{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--text)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:22px;height:22px}
.brand{font-weight:650;font-size:16px;flex:1}
.status{font-size:12px;color:var(--muted)}
#chat{flex:1;min-height:0;overflow:auto;padding:24px 16px 30px;scroll-behavior:smooth}
.messages{width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.welcome{margin:auto;text-align:center;padding:10vh 16px 16px;color:var(--muted)}
.welcome h1{font-size:27px;letter-spacing:-.7px;color:var(--text);margin:0 0 8px;font-weight:650}
.welcome p{margin:0}
.message{display:flex;gap:12px;align-items:flex-start;max-width:100%}
.message.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface2);font-size:13px;font-weight:650}
.message.user .avatar{background:var(--accent);color:#fff}
.content{max-width:min( min(100% - 44px, 680px), 88%);padding:3px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user .content{background:var(--surface);padding:10px 14px;border-radius:18px 18px 4px 18px}
.message.assistant .content{padding-top:2px}
.message.error .content{color:#b42318}
.composer-wrap{flex:none;padding:12px 16px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 16%)}
.composer{max-width:780px;margin:0 auto;border:1px solid #d9d9df;border-radius:24px;padding:8px 9px 8px 16px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 3px 18px #00000008;background:var(--bg)}
.composer:focus-within{border-color:#aaaab4}
#prompt{border:0;outline:0;resize:none;min-height:36px;max-height:160px;flex:1;padding:7px 0;background:transparent;color:var(--text);line-height:1.45}
#prompt::placeholder{color:#9999a2}
#send{width:38px;height:38px;border:0;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
#send:disabled{opacity:.45;cursor:default}
#send svg{width:19px;height:19px}
.hint{text-align:center;font-size:11px;color:#9999a2;margin:8px auto 0}
#overlay{position:fixed;inset:0;background:#0006;z-index:20;opacity:0;visibility:hidden;transition:.2s}
#overlay.open{opacity:1;visibility:visible}
#drawer{position:fixed;z-index:21;inset:0 auto 0 0;width:min(360px,88vw);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:8px 0 30px #00000010}
#drawer.open{transform:translateX(0)}
.drawer-head{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-weight:650}
.drawer-body{overflow:auto;padding:8px 18px 28px}
.section{padding:16px 0;border-bottom:1px solid var(--line)}
.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 12px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:10px 11px;outline:none}
.field input:focus,.field textarea:focus{border-color:#aaaab4}
.field textarea{min-height:88px;resize:vertical}
.smallbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 12px;border-radius:10px}
.smallbtn:hover{background:var(--surface2)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.memory-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.memory-item span{flex:1;overflow-wrap:anywhere}
.memory-item button{border:0;background:transparent;color:var(--muted);padding:0 4px}
.empty{font-size:13px;color:var(--muted)}
@media(max-width:520px){#chat{padding:18px 13px}.composer-wrap{padding-left:12px;padding-right:12px}.topbar{padding:0 12px}}
</style>
</head>
<body>
<header class="topbar">
<button class="iconbtn" id="menuBtn" aria-label="Открыть меню" title="Меню">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>
<div class="brand" id="botTitle">Gemma</div>
<div class="status" id="status">Готова к общению</div>
</header>
<main id="chat"><div class="messages" id="messages"></div></main>
<div class="composer-wrap">
<form class="composer" id="chatForm">
<textarea id="prompt" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение"></textarea>
<button id="send" type="submit" aria-label="Отправить">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
</form>
<div class="hint">Enter — отправить · Shift + Enter — новая строка</div>
</div>
<div id="overlay"></div>
<aside id="drawer" aria-hidden="true">
<div class="drawer-head"><span>Меню и настройки</span><button class="iconbtn" id="closeBtn" aria-label="Закрыть меню">✕</button></div>
<div class="drawer-body">
<section class="section">
<h2>Чат</h2>
<div class="row-actions"><button class="smallbtn" id="newChat">＋ Новый чат</button><button class="smallbtn" id="clearChat">Очистить историю</button></div>
</section>
<section class="section">
<h2>Подключение</h2>
<label class="field"><span>Адрес AI Worker</span><input id="workerUrl" type="url" placeholder="https://…workers.dev" autocomplete="url"></label>
</section>
<section class="section">
<h2>Ассистент</h2>
<label class="field"><span>Имя</span><input id="botName" type="text" placeholder="Gemma"></label>
<label class="field"><span>Инструкция для ассистента</span><textarea id="systemPrompt" placeholder="Как ассистент должен отвечать?"></textarea></label>
</section>
<section class="section">
<h2>Профиль</h2>
<label class="field"><span>Как к тебе обращаться</span><input id="userName" type="text" placeholder="Имя"></label>
</section>
<section class="section">
<h2>Память</h2>
<p class="empty">Важные факты сохраняются здесь и передаются ассистенту в следующих сообщениях.</p>
<label class="field"><span>Добавить факт в память</span><input id="memoryInput" type="text" placeholder="Например: я учусь на повара"></label>
<div class="row-actions"><button class="smallbtn" id="addMemory">Сохранить факт</button><button class="smallbtn" id="clearMemory">Очистить память</button></div>
<div id="memoryList" style="margin-top:10px"></div>
</section>
</div>
</aside>
<script>
"use strict";
const $ = id => document.getElementById(id);
const DEFAULT_WORKER = "https://gemmaaimy.comedyfox6.workers.dev";
const DEFAULT_SYSTEM = "Ты дружелюбный, живой собеседник. Отвечай по-русски, естественно и по делу.";
function read(key, fallback){try{const value=JSON.parse(localStorage.getItem(key));return value ?? fallback}catch{return fallback}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(error){console.error(error);return false}}
let history = read("history",[]);
let memory = read("memory",[]);
let cfg = Object.assign({url:DEFAULT_WORKER,sys:DEFAULT_SYSTEM,uName:"",bName:"Gemma"},read("cfg",{}));
if(!cfg.url) cfg.url=DEFAULT_WORKER;
if(!Array.isArray(history)) history=[];
if(!Array.isArray(memory)) memory=[];
let busy=false;

function openMenu(){$("drawer").classList.add("open");$("overlay").classList.add("open");$("drawer").setAttribute("aria-hidden","false")}
function closeMenu(){$("drawer").classList.remove("open");$("overlay").classList.remove("open");$("drawer").setAttribute("aria-hidden","true")}
$("menuBtn").addEventListener("click",openMenu);
$("closeBtn").addEventListener("click",closeMenu);
$("overlay").addEventListener("click",closeMenu);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});

function saveConfig(){cfg.url=$("workerUrl").value.trim();cfg.bName=$("botName").value.trim()||"Gemma";cfg.sys=$("systemPrompt").value.trim()||DEFAULT_SYSTEM;cfg.uName=$("userName").value.trim();write("cfg",cfg);$("botTitle").textContent=cfg.bName}
function fillSettings(){$("workerUrl").value=cfg.url;$("botName").value=cfg.bName;$("systemPrompt").value=cfg.sys;$("userName").value=cfg.uName;$("botTitle").textContent=cfg.bName||"Gemma"}
["workerUrl","botName","systemPrompt","userName"].forEach(id=>$(id).addEventListener("change",saveConfig));

function scrollBottom(){$("chat").scrollTop=$("chat").scrollHeight}
function render(){
 const root=$("messages");root.replaceChildren();
 if(!history.length){const welcome=document.createElement("div");welcome.className="welcome";const h=document.createElement("h1");h.textContent="Чем займёмся?";const p=document.createElement("p");p.textContent=(cfg.bName||"Gemma")+" готова к разговору.";welcome.append(h,p);root.append(welcome);return}
 history.forEach(item=>appendMessage(item.role==="user"?"user":"assistant",item.content));
 scrollBottom();
}
function appendMessage(role,text,extraClass=""){
 const row=document.createElement("div");row.className="message "+role+(extraClass?" "+extraClass:"");
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?(cfg.uName?cfg.uName[0].toUpperCase():"Я"):(cfg.bName||"G")[0].toUpperCase();
 const body=document.createElement("div");body.className="content";body.textContent=text;
 row.append(avatar,body);$("messages").append(row);scrollBottom();return body;
}
const MEMORY_RULES="\n\nДолговременная память: если пользователь сообщает важный факт о себе, который пригодится в будущих разговорах, добавь в самый конец ответа отдельный тег [[mem: краткий факт]]. Не записывай временные мелочи и не дублируй факты. Тег не показывай и не объясняй.";
function buildMessages(){
 let system=cfg.sys||DEFAULT_SYSTEM;
 if(cfg.bName)system+="\nТебя зовут "+cfg.bName+".";
 if(cfg.uName)system+="\nПользователя зовут "+cfg.uName+".";
 system+=MEMORY_RULES;
 if(memory.length)system+="\n\nСохранённая память о пользователе:\n- "+memory.join("\n- ");
 return [{role:"system",content:system},...history.slice(-30)];
}
function extractMemory(reply){
 const pattern=/\[\[\s*mem\s*:\s*([^\]]+?)\s*\]\]/gi;let match,added=0;
 while((match=pattern.exec(reply))){const fact=match[1].trim();if(fact&&!memory.includes(fact)){memory.push(fact);added++}}
 if(added){write("memory",memory);renderMemory()}
 return {text:reply.replace(pattern,"").trim(),added};
}
function renderMemory(){
 const root=$("memoryList");root.replaceChildren();
 if(!memory.length){const p=document.createElement("div");p.className="empty";p.textContent="Память пока пустая.";root.append(p);return}
 memory.forEach((fact,index)=>{const row=document.createElement("div");row.className="memory-item";const span=document.createElement("span");span.textContent=fact;const del=document.createElement("button");del.type="button";del.textContent="Удалить";del.addEventListener("click",()=>{memory.splice(index,1);write("memory",memory);renderMemory()});row.append(span,del);root.append(row)});
}
function getReply(data){
 if(typeof data.reply==="string")return data.reply;
 if(typeof data.response==="string")return data.response;
 if(typeof data.content==="string")return data.content;
 if(data.choices?.[0]?.message?.content)return data.choices[0].message.content;
 if(data.result?.response)return data.result.response;
 throw new Error("Сервер вернул ответ в неизвестном формате");
}
async function sendMessage(raw){
 const text=raw.trim();if(!text||busy)return;
 saveConfig();
 if(!cfg.url){openMenu();appendMessage("assistant","Сначала укажи адрес AI Worker в меню.");return}
 history.push({role:"user",content:text});write("history",history);render();
 busy=true;$("send").disabled=true;$("status").textContent="Печатает…";
 const pending=appendMessage("assistant","Думаю…");
 try{
  const response=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:buildMessages()})});
  const rawBody=await response.text();let data;
  try{data=JSON.parse(rawBody)}catch{throw new Error("Сервер вернул не JSON (HTTP "+response.status+")")}
  if(!response.ok||data.error)throw new Error(data.error||("HTTP "+response.status));
  const extracted=extractMemory(getReply(data));const answer=extracted.text||"…";
  history.push({role:"assistant",content:answer});write("history",history);pending.textContent=answer;
  if(extracted.added){const note=document.createElement("div");note.className="empty";note.textContent="Сохранено в память: "+extracted.added;pending.append(document.createElement("br"),note)}
 }catch(error){pending.textContent="Не удалось получить ответ: "+error.message;pending.parentElement.classList.add("error")}
 finally{busy=false;$("send").disabled=false;$("status").textContent="Готова к общению";$("prompt").focus();scrollBottom()}
}
$("chatForm").addEventListener("submit",event=>{event.preventDefault();const value=$("prompt").value;$("prompt").value="";$("prompt").style.height="auto";sendMessage(value)});
$("prompt").addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();$("chatForm").requestSubmit()}});
$("prompt").addEventListener("input",()=>{$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,160)+"px"});
$("newChat").addEventListener("click",()=>{if(!history.length){closeMenu();return}if(confirm("Начать новый чат? Текущая переписка будет очищена, память останется.")){history=[];write("history",history);render();closeMenu()}});
$("clearChat").addEventListener("click",()=>{if(confirm("Удалить всю историю переписки? Память останется.")){history=[];write("history",history);render();closeMenu()}});
$("addMemory").addEventListener("click",()=>{const value=$("memoryInput").value.trim();if(!value)return;if(!memory.includes(value)){memory.push(value);write("memory",memory);renderMemory()}$("memoryInput").value=""});
$("memoryInput").addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();$("addMemory").click()}});
$("clearMemory").addEventListener("click",()=>{if(confirm("Удалить все сохранённые факты из памяти?")){memory=[];write("memory",memory);renderMemory()}});
fillSettings();renderMemory();render();
</script>
</body>
</html>
